[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miso-assistant"
version = "0.1.0"
description = "Local-first household assistant runtime"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"miso.web" = [
  "*.html",
  "*.css",
  "*.js",
  "*.webmanifest",
  "*.svg",
  "*.png",
  "assets/*.riv",
  "vendor/rive/*.js",
  "vendor/rive/*.wasm",
  "vendor/rive/*.txt",
]
